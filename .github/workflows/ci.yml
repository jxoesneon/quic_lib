name: Dart QUIC CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly fuzz tests at 02:00 UTC
    - cron: '0 2 * * *'
    # Weekly performance benchmarks at 03:00 UTC on Sundays
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: beta
    continue-on-error: ${{ matrix.sdk == 'beta' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Run dart analyze
        run: dart analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  unit:
    name: Unit Tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
        include:
          - os: ubuntu-latest
            sdk: beta
    continue-on-error: ${{ matrix.sdk == 'beta' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Run unit tests
        run: dart test --concurrency=4

  

  integration:
    name: Integration Tests
    if: github.event_name == 'pull_request'
    needs: unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Check Docker availability
        id: docker
        shell: bash
        run: |
          if command -v docker &> /dev/null && docker info &> /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run integration tests
        if: steps.docker.outputs.available == 'true'
        run: dart test --tags integration --concurrency=4

      - name: Skip integration tests (no Docker)
        if: steps.docker.outputs.available == 'false'
        run: |
          echo "Docker is unavailable on this runner (${{ matrix.os }})."
          echo "Skipping integration tests that require external containers."

  coverage:
    name: Coverage
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: dart run coverage:test_with_coverage --out coverage

      - name: Format coverage to LCOV
        run: |
          dart run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --packages=.dart_tool/package_config.json \
            --report-on=lib

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea58fc865b7da5fdfdf88663f # v4.6.2
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage/lcov.info


  fuzz:
    name: Fuzz Tests
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Run fuzz harness
        run: dart run test/fuzz/fuzz_harness.dart

  performance:
    name: Performance Benchmarks
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@65eb853643f5fc5646e3b1ce0934064b8b1a6f23 # v1.7.2
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e1db2e1d916222352f7a2 # v4.3.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: dart pub get

      - name: Run benchmark harness
        run: dart run test/benchmark/benchmark_harness.dart

  changelog:
    name: Check CHANGELOG.md
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin main --depth=1
            # Check if CHANGELOG.md has [Unreleased] section
            if grep -q "## \[Unreleased\]" CHANGELOG.md; then
              echo "CHANGELOG.md has [Unreleased] section."
            else
              echo "WARNING: CHANGELOG.md missing [Unreleased] section. Consider adding it for pending changes."
            fi
            # Check if there are changes that should affect changelog
            if git diff --name-only origin/main...HEAD | grep -E "\.(dart|yaml|md)$" > /dev/null; then
              echo "Code changes detected in this PR."
            fi
          else
            # For pushes to main, just ensure CHANGELOG.md exists and has valid format
            if [[ -f "CHANGELOG.md" ]]; then
              echo "CHANGELOG.md exists."
              if grep -q "## \[" CHANGELOG.md; then
                echo "CHANGELOG.md has version headings."
              else
                echo "ERROR: CHANGELOG.md missing version headings."
                exit 1
              fi
            else
              echo "ERROR: CHANGELOG.md not found."
              exit 1
            fi
          fi
